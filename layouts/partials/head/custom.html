<style>
  /* 1. 声明本地的 Lato 字体 */
  @font-face {
    font-family: 'LatoLocal';
    src: url('/fonts/Lato-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'LatoLocal';
    src: url('/fonts/Lato-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'LatoLocal';
    src: url('/fonts/Lato-Italic.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  /* 2. 覆盖 Stack 主题的字体变量 */
  :root {
    /* 系统界面字体：优先用 Lato，中文回退到系统默认 */
    --sys-font-family: 'LatoLocal', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft Yahei', sans-serif;
    
    /* 代码块字体：保留原样（不使用 JetBrains Mono） */
    --code-font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
    
    /* 基础字体和文章正文字体：统一使用 LatoLocal */
    --base-font-family: 'LatoLocal', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft Yahei', sans-serif;
    
    --article-font-family: var(--base-font-family);
  }
</style>
